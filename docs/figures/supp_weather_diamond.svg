   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="14.047656" y="31.469705" transform="rotate(-0 14.047656 31.469705)">Temperature</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(14.047656 42.189063)">warm air is thinner →</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(14.047656 52.391388)">ball carries ~+2.5 ft per +10°F</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="326.814504" y="31.470064" transform="rotate(-0 326.814504 31.470064)">Humidity</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(326.814504 42.189063)">humid air is LESS dense →</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(326.814504 52.391388)">slightly more carry (counter-intuitive)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="14.047656" y="244.830394" transform="rotate(-0 14.047656 244.830394)">Wind to center</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(14.047656 255.549062)">out: more carry, more runs</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(14.047656 265.751386)">in: knocks fly balls down</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #009e73" x="326.814504" y="244.830394" transform="rotate(-0 326.814504 244.830394)">Park factor</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(326.814504 255.549394)">100 = neutral · 112 = hitter</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(326.814504 265.751718)">120+ ≈ Coors (altitude, thin air)</text>
   </g>
